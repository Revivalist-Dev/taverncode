<style>
  /* Hide Color Scheme toolbar when tavern-vscode theme is active */
  html[data-tavern-theme="tavern-vscode"] [aria-label^="Color Scheme"] {
    display: none !important;
  }

  /* Hide VS Code Theme toolbar by default and when tavern theme is active */
  html:not([data-tavern-theme="tavern-vscode"]) [aria-label^="VSCode Theme"] {
    display: none !important;
  }
</style>
