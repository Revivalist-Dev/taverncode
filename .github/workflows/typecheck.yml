name: typecheck

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # taverncode_change start
  changes:
    name: detect typecheck changes
    runs-on: ${{ github.repository == 'Kilo-Org/kilocode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # taverncode_change
    outputs:
      javascript: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.javascript }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Detect typecheck changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: Kilo-Org/paths-filter@668c092af3649c4b664c54e4b704aa46782f6f7c # v3
        with:
          predicate-quantifier: every
          filters: |
            javascript:
              - '**'
              - '!.changeset/**'
              - '!.tavern/plans/**'
  # taverncode_change end

  typecheck-js:
    name: typecheck-js
    needs: changes # taverncode_change
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.javascript == 'true' # taverncode_change
    runs-on: ${{ github.repository == 'Kilo-Org/kilocode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # taverncode_change
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # taverncode_change

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # taverncode_change start
      - name: Run TypeScript typecheck
        run: bun turbo typecheck
      # taverncode_change end

  # taverncode_change start
  required:
    name: typecheck
    runs-on: ${{ github.repository == 'Kilo-Org/kilocode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # taverncode_change
    needs:
      - typecheck-js
      - changes
    if: always()
    steps:
      - name: Verify typecheck jobs passed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "javascript=${{ needs.changes.outputs.javascript }}"
          echo "typecheck-js=${{ needs.typecheck-js.result }}"
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.javascript }}" = "true" ]; then
            test "${{ needs.typecheck-js.result }}" = "success"
          else
            test "${{ needs.changes.outputs.javascript }}" = "false"
            test "${{ needs.typecheck-js.result }}" = "skipped"
          fi
  # taverncode_change end
