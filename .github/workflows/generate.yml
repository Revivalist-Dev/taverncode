name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # taverncode_change
        # taverncode_change start
        with:
          persist-credentials: false
        # taverncode_change end

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # taverncode_change start
          tavern-maintainer-app-id: ${{ secrets.TAVERN_MAINTAINER_APP_ID }}
          tavern-maintainer-app-secret: ${{ secrets.TAVERN_MAINTAINER_APP_SECRET }}
          # taverncode_change end

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
