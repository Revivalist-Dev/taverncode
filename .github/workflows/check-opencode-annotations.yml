name: Check shared upstream annotations

on:
  pull_request:
    paths:
      - ".github/**"
      - "github/**"
      - "packages/extensions/**"
      - "packages/tavern-*/**"
      - "packages/*/src/taverncode/**"
      - "packages/*/src/tavern-*/**"
      - "packages/plugin-atomic-chat/**"
      - "packages/opencode/**"
      - "packages/script/**"
      - "packages/shared/**"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "script/**"
      - "package.json"
      - "bun.lock"
      - "!packages/tavern-jetbrains/**"
  workflow_dispatch:

jobs:
  check-annotations:
    name: Check taverncode_change annotations
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # taverncode_change
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Check taverncode_change annotations in shared upstream files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            bun run script/check-opencode-annotations.ts --base "$BASE_SHA"
          else
            echo "No PR base SHA available (workflow_dispatch without PR context) — skipping."
          fi

      # taverncode_change start
      - name: Check Effect Promise facade allowlist
        run: bun run script/check-opencode-promise-facades.ts

      - name: Check domain architecture boundaries and ratchets
        run: bun run script/check-architecture.ts

      - name: Test the Tavern duplication ratchet
        working-directory: packages/script
        run: bun test ./tests/check-taverncode-duplication.test.ts

      - name: Check Tavern-owned code duplication
        run: bun run check:duplication

      - name: Check model tool network boundary
        run: bun run script/check-model-tool-network.ts

      - name: Check workflow allowlist
        run: bun run script/check-workflows.ts
      # taverncode_change end
