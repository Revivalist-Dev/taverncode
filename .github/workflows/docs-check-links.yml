name: Check Links

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/tavern-docs/**"
      - ".github/workflows/docs-check-links.yml"
  schedule:
    # Run daily at 9am UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  link-checker:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # taverncode_change

      - name: Link Checker
        uses: Kilo-Org/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411
        with:
          # taverncode_change start - avoid deployment races; scheduled and manual runs check the live URL
          args: >-
            "**/*.md"
            ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('--remap ''tavern-docs/docs tavern-docs/pages'' --remap ''^https://tavern\.ai/docs/oauth/tavern/client\.json$ file://{0}/packages/tavern-docs/public/oauth/tavern/client.json''', github.workspace) || '' }}
          # taverncode_change end
          workingDirectory: packages/tavern-docs
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
